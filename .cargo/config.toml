[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Node has supported SIMD since v16.4. `fast_image_resize` has simd128 kernels.
#
# The module imports its memory, so that JS can choose the maximum size. The initial size is 32 MiB
# (512 pages * 64 KiB/page), and must match `INITIAL_PAGES` in `packages/nsio/wasm.ts`. The stack
# size (8 MiB) matches native main threads.
[target.wasm32-wasip1]
rustflags = [
  "-C", "target-feature=+simd128",
  "-C", "link-arg=--import-memory",
  "-C", "link-arg=--initial-memory=33554432",
  "-C", "link-arg=-zstack-size=8388608",
]
