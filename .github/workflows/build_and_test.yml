name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
  # From release.yml, which packs the binaries that this builds and tests.
  workflow_call:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '10.13'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Uses the version and components from rust-toolchain.toml.
      - name: Install Rust
        id: rust
        background: true
        run: |
          set -euo pipefail
          rustup toolchain install
          cargo fetch --locked
      - run: npm install --global pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - wait: rust
      # typeshare only publishes Windows binaries.
      - name: Install typeshare
        id: typeshare
        background: true
        run: cargo install typeshare-cli --version 1.13.4 --locked
      # Turbo runs these concurrently, but clippy and `cargo test` share target/debug, so cargo's
      # build directory lock serializes them. `--continue` reports every failure. Only cargo's tests:
      # the end-to-end tests run in the test jobs.
      - run: pnpm exec turbo run quality nsio-cargo#test --continue
      - wait: typeshare
      - name: Check that generated protocol types are up to date
        run: |
          set -euo pipefail
          pnpm generate
          git diff --exit-code -- packages/nsio/protocol.generated.ts

  build:
    name: Build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-26
            target: aarch64-apple-darwin
          - host: macos-26
            target: x86_64-apple-darwin
          - host: windows-2025
            target: x86_64-pc-windows-msvc
          - host: windows-2025
            target: aarch64-pc-windows-msvc
          # Linux targets use cargo-zigbuild. For gnu targets, scripts/build-native.mjs targets glibc
          # 2.28, the same as official Node.js binaries.
          - host: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            flags: -x
          - host: ubuntu-26.04
            target: aarch64-unknown-linux-gnu
            flags: -x
          - host: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            flags: -x
          - host: ubuntu-26.04
            target: aarch64-unknown-linux-musl
            flags: -x
          - host: ubuntu-26.04
            target: riscv64gc-unknown-linux-gnu
            flags: -x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - parallel:
          - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
            with:
              node-version: 24
          - name: Install Rust
            shell: bash
            env:
              TARGET: ${{ matrix.settings.target }}
            run: |
              set -euo pipefail
              rustup toolchain install
              rustup target add "$TARGET"
              cargo fetch --locked --target "$TARGET"
          - name: Install zig and cargo-zigbuild
            if: ${{ matrix.settings.flags == '-x' }}
            env:
              ZIG_VERSION: 0.17.0
              ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
              CARGO_ZIGBUILD_VERSION: 0.24.0
              CARGO_ZIGBUILD_SHA256: 52be2cb85ad3875682564a29bac1832b2ab3db68b1c504765c92d5249cc9b96f
            run: |
              set -euo pipefail
              dir="$RUNNER_TEMP/zig"
              mkdir -p "$dir/bin"
              curl --retry 3 -fsSL -o "$dir/zig.tar.xz" \
                "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
              echo "$ZIG_SHA256  $dir/zig.tar.xz" | sha256sum -c -
              tar -xJf "$dir/zig.tar.xz" -C "$dir" --strip-components=1
              curl --retry 3 -fsSL -o "$dir/cargo-zigbuild.tar.xz" \
                "https://github.com/rust-cross/cargo-zigbuild/releases/download/v$CARGO_ZIGBUILD_VERSION/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz"
              echo "$CARGO_ZIGBUILD_SHA256  $dir/cargo-zigbuild.tar.xz" | sha256sum -c -
              tar -xJf "$dir/cargo-zigbuild.tar.xz" -C "$dir/bin" --strip-components=1
              chmod +x "$dir/bin/cargo-zigbuild"
              echo "$dir" >> "$GITHUB_PATH"
              echo "$dir/bin" >> "$GITHUB_PATH"
      # Only needs Node.js, not turbo (or pnpm).
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.settings.target }}
          FLAGS: ${{ matrix.settings.flags }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # FLAGS is intentionally word-split.
          node scripts/build-native.mjs --target "$TARGET" $FLAGS
      - name: Check glibc compatibility
        if: ${{ endsWith(matrix.settings.target, '-gnu') }}
        run: |
          set -euo pipefail
          for file in packages/nsio/safe-image-optimization-worker.*; do
            newest=$(objdump -T "$file" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "$file requires $newest"
            if [ "$(printf '%s\nGLIBC_2.28\n' "$newest" | sort -V | tail -1)" != "GLIBC_2.28" ]; then
              echo "::error::$file requires $newest, but must support glibc 2.28"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-${{ matrix.settings.target }}
          path: packages/nsio/safe-image-optimization-worker.*
          if-no-files-found: error

  build-wasm:
    name: Build wasm32-wasip1
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      WASI_SDK_VERSION: '34'
      WASI_SDK_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Rust
        id: rust
        background: true
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add wasm32-wasip1
          cargo fetch --locked --target wasm32-wasip1
      # Used to compile libwebp (C). See scripts/build-wasm.mjs.
      - name: Install wasi-sdk
        id: wasi-sdk
        background: true
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/wasi-sdk"
          mkdir -p "$dir"
          curl --retry 3 -fsSL -o "$dir/wasi-sdk.tar.gz" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-$WASI_SDK_VERSION/wasi-sdk-$WASI_SDK_VERSION.0-x86_64-linux.tar.gz"
          echo "$WASI_SDK_SHA256  $dir/wasi-sdk.tar.gz" | sha256sum -c -
          tar -xzf "$dir/wasi-sdk.tar.gz" -C "$dir" --strip-components=1
          echo "WASI_SDK_PATH=$dir" >> "$GITHUB_ENV"
      - run: npm install --global pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - wait: [rust, wasi-sdk]
      - run: pnpm exec turbo run build:wasm:release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm32-wasip1
          path: packages/nsio/safe-image-optimization.wasm
          if-no-files-found: error

  # The full range of Node.js versions is only tested on Linux (glibc) and wasm. Other platforms only
  # test the oldest version that Next.js supports. Tooling (pnpm, tsc) runs on Node.js 24, and the
  # tests are compiled to JS (`build:test`), because Node.js 20 can't strip types. These jobs don't
  # use turbo, which needs cargo (and downloads every crate) even for JS tasks: they run the JS
  # package's scripts in its directory (the root's `build` uses turbo).
  test:
    name: Test ${{ matrix.target }} on ${{ matrix.host }} - node@${{ matrix.node }}
    needs: build
    runs-on: ${{ matrix.host }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/nsio
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-22.04, target: x86_64-unknown-linux-gnu, node: '20.9' }
          - { host: ubuntu-26.04, target: x86_64-unknown-linux-gnu, node: '22' }
          - { host: ubuntu-26.04, target: x86_64-unknown-linux-gnu, node: '24' }
          - { host: ubuntu-26.04, target: x86_64-unknown-linux-gnu, node: '26' }
          - { host: ubuntu-26.04-arm, target: aarch64-unknown-linux-gnu, node: '20.9' }
          # We build with a newer macOS, but test with an older version to make sure it's compatible
          - { host: macos-15, target: aarch64-apple-darwin, node: '20.9' }
          # Runs under Rosetta.
          - { host: macos-15, target: x86_64-apple-darwin, architecture: x64, node: '20.9' }
          # We build with a newer Windows, but test with an older one
          - { host: windows-2022, target: x86_64-pc-windows-msvc, node: '20.9' }
          - { host: windows-11-arm, target: aarch64-pc-windows-msvc, node: '20.9' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          architecture: ${{ matrix.architecture }}
      - id: worker
        background: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-${{ matrix.target }}
          path: packages/nsio
      # A background step's PATH changes only apply after its `wait`, so the tooling still runs on
      # Node.js 24.
      - id: test-node
        background: true
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.architecture }}
      - run: npm install --global pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:test
      - wait: [worker, test-node]
      # Artifacts don't keep file permissions.
      - if: ${{ runner.os != 'Windows' }}
        run: chmod +x safe-image-optimization-worker.*
      # Bash expands the glob (Node.js 20's test runner doesn't), including on Windows.
      - run: node --test test/*.test.js
        shell: bash

  test-musl:
    name: Test ${{ matrix.target }} - node@${{ matrix.node.version }}
    needs: build
    runs-on: ${{ startsWith(matrix.target, 'aarch64') && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/nsio
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
        node:
          # The digest is the multi-arch index's, so it works on both runners.
          - version: '26.13.0'
            image: node:26.13.0-alpine3.24@sha256:c6ad9e9c1d80f6eb607c26b4b0a132ff7a2344fad1c78ea3baa2a7d4c8de6d94
    env:
      IMAGE: ${{ matrix.node.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: worker
        background: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-${{ matrix.target }}
          path: packages/nsio
      - name: Pull the Alpine image
        id: image
        background: true
        run: docker pull "$IMAGE"
      - run: npm install --global pnpm@12.11.2
      # Install sharp's musl binaries (used to generate test images) for the Alpine container.
      - run: pnpm install --frozen-lockfile --libc glibc --libc musl
      - run: pnpm build
      - run: pnpm build:test
      - wait: [worker, image]
      # Artifacts don't keep file permissions.
      - run: chmod +x safe-image-optimization-worker.*
      - name: Test in Alpine
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$PWD" \
            "$IMAGE" node --test test/*.test.js

  # Under QEMU's user mode emulation, which doesn't support seccomp or `RLIMIT_DATA` (see the test
  # step). Official Node.js binaries and images don't include riscv64, so this uses an unofficial
  # build in a Debian image.
  test-riscv64:
    name: Test riscv64gc-unknown-linux-gnu - node@${{ matrix.node.version }}
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/nsio
    strategy:
      fail-fast: false
      matrix:
        node:
          # Recent unofficial builds only have riscv64 binaries with pointer compression.
          - version: '26.13.0'
            sha256: 863c67421d5d5850b6ac8f038bce9a306eca23aade5c6bf3fb0b9b7feb6bb179
    env:
      # The multi-arch index's digest.
      IMAGE: debian:trixie-20261027-slim@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: worker
        background: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-riscv64gc-unknown-linux-gnu
          path: packages/nsio
      # qemu-user-binfmt registers QEMU with binfmt_misc, with the flag that lets it run riscv64
      # binaries in containers. The image doesn't have `ps` (for the fork server tests) or libatomic
      # (for Node.js), and installing them is slow under QEMU, so it runs alongside the JS build.
      - name: Install QEMU and build the image
        id: image
        background: true
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-user-binfmt
          docker build --platform linux/riscv64 --tag nsio-riscv64 - <<EOF
          FROM $IMAGE
          RUN apt-get update && apt-get install -y --no-install-recommends procps libatomic1
          EOF
      - name: Download Node.js
        id: node
        background: true
        env:
          NODE_VERSION: ${{ matrix.node.version }}
          NODE_SHA256: ${{ matrix.node.sha256 }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/node-riscv64"
          mkdir -p "$dir"
          curl --retry 3 -fsSL -o "$RUNNER_TEMP/node-riscv64.tar.xz" \
            "https://unofficial-builds.nodejs.org/download/release/v$NODE_VERSION/node-v$NODE_VERSION-linux-riscv64-pointer-compression.tar.xz"
          echo "$NODE_SHA256  $RUNNER_TEMP/node-riscv64.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/node-riscv64.tar.xz" -C "$dir" --strip-components=1
      - run: npm install --global pnpm@12.11.2
      # Install sharp's riscv64 binaries (used to generate test images) for the container.
      - run: pnpm install --frozen-lockfile --cpu x64 --cpu riscv64
      - run: pnpm build
      - run: pnpm build:test
      - wait: [worker, image, node]
      # Artifacts don't keep file permissions.
      - run: chmod +x safe-image-optimization-worker.*
      # - NEXT_SAFE_IMAGE_OPTIMIZATION_DANGEROUSLY_IGNORE_SECCOMP_FAILURES: QEMU's user mode
      #   emulation doesn't support seccomp, so workers would fail to install their filters and exit
      #   (`ERR_WORKER_SPAWN`). This runs them unfiltered instead. Nothing here tests the filters.
      # - NSIO_TEST_QEMU: QEMU ignores `RLIMIT_DATA` (it would also limit QEMU's own allocations),
      #   so this skips the test that `limitProcessMemoryBytes` is enforced.
      - name: Test in QEMU
        run: |
          set -euo pipefail
          docker run --rm --platform linux/riscv64 \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$PWD" \
            -v "$RUNNER_TEMP/node-riscv64:/opt/node:ro" \
            -e NEXT_SAFE_IMAGE_OPTIMIZATION_DANGEROUSLY_IGNORE_SECCOMP_FAILURES=1 \
            -e NSIO_TEST_QEMU=1 \
            nsio-riscv64 /opt/node/bin/node --test test/*.test.js

  test-wasm:
    name: Test wasm32-wasip1 - node@${{ matrix.node }}
    needs: build-wasm
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/nsio
    strategy:
      fail-fast: false
      matrix:
        node:
          - '20'
          - '26'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: wasm
        background: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm32-wasip1
          path: packages/nsio
      # Its PATH changes only apply after its `wait`, like in `test`.
      - id: test-node
        background: true
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:test
      - wait: [wasm, test-node]
      - run: node --test test/*.test.js
        env:
          NEXT_SAFE_IMAGE_OPTIMIZATION_BACKEND: wasm

  # We block merging unless this job passes. This is enforced by a "require status checks to pass"
  # rule on the main branch.
  # <https://github.com/vercel-labs/next-safe-image-optimization/settings/rules/26230958>
  tests-pass:
    needs:
      # Some of these jobs are dependencies of other jobs. If they fail, the dependent jobs are
      # skipped, which would let this job pass if the dependency isn't listed here.
      - lint
      - build
      - build-wasm
      - test
      - test-musl
      - test-riscv64
      - test-wasm
    if: always()
    runs-on: ubuntu-26.04
    name: thank you, next
    steps:
      - run: exit 1
        if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
