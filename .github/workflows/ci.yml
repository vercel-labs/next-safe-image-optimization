name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '10.13'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      # Uses the version and components from rust-toolchain.toml.
      - run: rustup toolchain install
      - run: pnpm exec turbo run format:check
      - run: pnpm exec turbo run lint
      - run: pnpm exec turbo run test
      # typeshare only publishes Windows binaries.
      - run: cargo install typeshare-cli --version 1.13.4 --locked
      - name: Check that generated protocol types are up to date
        run: |
          set -euo pipefail
          pnpm generate
          git diff --exit-code -- js/protocol.generated.ts
      - run: pnpm exec turbo run typecheck

  build:
    name: Build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
          # Linux targets use cargo-zigbuild. For gnu targets, scripts/build-native.mjs targets glibc
          # 2.28, the same as official Node.js binaries.
          - host: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            flags: -x
          - host: ubuntu-26.04
            target: aarch64-unknown-linux-gnu
            flags: -x
          - host: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            flags: -x
          - host: ubuntu-26.04
            target: aarch64-unknown-linux-musl
            flags: -x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Rust
        shell: bash
        env:
          TARGET: ${{ matrix.settings.target }}
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add "$TARGET"
      - name: Install zig and cargo-zigbuild
        if: ${{ matrix.settings.flags == '-x' }}
        env:
          ZIG_VERSION: 0.17.0
          ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
          CARGO_ZIGBUILD_VERSION: 0.24.0
          CARGO_ZIGBUILD_SHA256: 52be2cb85ad3875682564a29bac1832b2ab3db68b1c504765c92d5249cc9b96f
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/zig"
          mkdir -p "$dir/bin"
          curl --retry 3 -fsSL -o "$dir/zig.tar.xz" \
            "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  $dir/zig.tar.xz" | sha256sum -c -
          tar -xJf "$dir/zig.tar.xz" -C "$dir" --strip-components=1
          curl --retry 3 -fsSL -o "$dir/cargo-zigbuild.tar.xz" \
            "https://github.com/rust-cross/cargo-zigbuild/releases/download/v$CARGO_ZIGBUILD_VERSION/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz"
          echo "$CARGO_ZIGBUILD_SHA256  $dir/cargo-zigbuild.tar.xz" | sha256sum -c -
          tar -xJf "$dir/cargo-zigbuild.tar.xz" -C "$dir/bin" --strip-components=1
          chmod +x "$dir/bin/cargo-zigbuild"
          echo "$dir" >> "$GITHUB_PATH"
          echo "$dir/bin" >> "$GITHUB_PATH"
      # Only needs Node.js, not turbo (or pnpm).
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.settings.target }}
          FLAGS: ${{ matrix.settings.flags }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # FLAGS is intentionally word-split.
          node scripts/build-native.mjs --target "$TARGET" $FLAGS
      - name: Check glibc compatibility
        if: ${{ endsWith(matrix.settings.target, '-gnu') }}
        run: |
          set -euo pipefail
          for file in safe-image-optimization-worker.*; do
            newest=$(objdump -T "$file" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "$file requires $newest"
            if [ "$(printf '%s\nGLIBC_2.28\n' "$newest" | sort -V | tail -1)" != "GLIBC_2.28" ]; then
              echo "::error::$file requires $newest, but must support glibc 2.28"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-${{ matrix.settings.target }}
          path: safe-image-optimization-worker.*
          if-no-files-found: error

  build-wasm:
    name: Build wasm32-wasip1
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      WASI_SDK_VERSION: '34'
      WASI_SDK_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global pnpm@12.11.2
      - name: Install Rust
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add wasm32-wasip1
      # Used to compile libwebp (C). See scripts/build-wasm.mjs.
      - name: Install wasi-sdk
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/wasi-sdk"
          mkdir -p "$dir"
          curl --retry 3 -fsSL -o "$dir/wasi-sdk.tar.gz" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-$WASI_SDK_VERSION/wasi-sdk-$WASI_SDK_VERSION.0-x86_64-linux.tar.gz"
          echo "$WASI_SDK_SHA256  $dir/wasi-sdk.tar.gz" | sha256sum -c -
          tar -xzf "$dir/wasi-sdk.tar.gz" -C "$dir" --strip-components=1
          echo "WASI_SDK_PATH=$dir" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build:wasm:release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm32-wasip1
          path: safe-image-optimization.wasm
          if-no-files-found: error

  # The full range of Node.js versions is only tested on Linux (glibc) and wasm. Other platforms only
  # test the oldest version that Next.js supports. Tooling (pnpm, tsc) runs on Node.js 24, and the
  # tests are compiled to JS (`build:test`), because Node.js 20 can't strip types. These jobs don't
  # use turbo, which needs cargo (and downloads every crate) even for JS tasks.
  test:
    name: Test ${{ matrix.target }} on ${{ matrix.host }} - node@${{ matrix.node }}
    needs: build
    runs-on: ${{ matrix.host }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-26.04, target: x86_64-unknown-linux-gnu, node: '20' }
          - { host: ubuntu-26.04, target: x86_64-unknown-linux-gnu, node: '22' }
          - { host: ubuntu-26.04, target: x86_64-unknown-linux-gnu, node: '24' }
          - { host: ubuntu-26.04, target: x86_64-unknown-linux-gnu, node: '26' }
          - { host: ubuntu-22.04, target: x86_64-unknown-linux-gnu, node: '20.9' }
          - { host: ubuntu-26.04-arm, target: aarch64-unknown-linux-gnu, node: '20.9' }
          - { host: macos-latest, target: aarch64-apple-darwin, node: '20.9' }
          # Runs under Rosetta.
          - { host: macos-latest, target: x86_64-apple-darwin, architecture: x64, node: '20.9' }
          - { host: windows-latest, target: x86_64-pc-windows-msvc, node: '20.9' }
          - { host: windows-11-arm, target: aarch64-pc-windows-msvc, node: '20.9' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          architecture: ${{ matrix.architecture }}
      - run: npm install --global pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:js
      - run: pnpm build:test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-${{ matrix.target }}
          path: .
      # Artifacts don't keep file permissions.
      - if: ${{ runner.os != 'Windows' }}
        run: chmod +x safe-image-optimization-worker.*
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.architecture }}
      # Bash expands the glob (Node.js 20's test runner doesn't), including on Windows.
      - run: node --test test/*.test.js
        shell: bash

  test-musl:
    name: Test ${{ matrix.target }} - node@${{ matrix.node }}
    needs: build
    runs-on: ${{ startsWith(matrix.target, 'aarch64') && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
        node:
          - '20.9'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global pnpm@12.11.2
      # Install sharp's musl binaries (used to generate test images) for the Alpine container.
      - run: pnpm install --frozen-lockfile --libc glibc --libc musl
      - run: pnpm build:js
      - run: pnpm build:test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-${{ matrix.target }}
          path: .
      # Artifacts don't keep file permissions.
      - run: chmod +x safe-image-optimization-worker.*
      - name: Test in Alpine
        env:
          NODE_VERSION: ${{ matrix.node }}
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            "node:$NODE_VERSION-alpine" node --test test/*.test.js

  test-wasm:
    name: Test wasm32-wasip1 - node@${{ matrix.node }}
    needs: build-wasm
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node:
          - '20'
          - '22'
          - '24'
          - '26'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:js
      - run: pnpm build:test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm32-wasip1
          path: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/*.test.js
        env:
          NEXT_SAFE_IMAGE_OPTIMIZATION_BACKEND: wasm
