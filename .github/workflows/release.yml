name: Release

# Publishes every npm package at package.json's version (set with `pnpm set-version`, in a PR), then
# creates the version's GitHub release and tag. The binaries are the ones that build_and_test.yml
# builds and tests in this run. With `dry-run`, it only packs and tests the packages (uploaded as `npm-packages`).
#
# npm trusts this workflow (by its file name) and the `npm` environment to publish the packages, so
# there's no npm token. See "Publishing" in AGENTS.md.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and test the packages, without publishing them
        type: boolean
        default: false

permissions: {}

# Must differ from build_and_test.yml's group: when it's called, its `github.workflow` is this workflow's, so
# the same expression would make the two wait for each other.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: version
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            exit 0
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are published from main. Other branches can only do a dry run."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" > /dev/null 2>&1; then
            echo "::error::v$version is already released. Set a new version with pnpm set-version."
            exit 1
          fi

  build-and-test:
    name: Build and test
    needs: check
    uses: ./.github/workflows/build_and_test.yml
    permissions:
      contents: read

  pack:
    name: Pack
    needs: build-and-test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      # For the third-party notices, which cargo-about generates from `cargo metadata`.
      - run: rustup toolchain install
      - name: Install cargo-about
        env:
          CARGO_ABOUT_VERSION: 0.9.3
          CARGO_ABOUT_SHA256: 3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/cargo-about"
          mkdir -p "$dir/bin"
          curl --retry 3 -fsSL -o "$dir/cargo-about.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/cargo-about-$CARGO_ABOUT_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$CARGO_ABOUT_SHA256  $dir/cargo-about.tar.gz" | sha256sum -c -
          tar -xzf "$dir/cargo-about.tar.gz" -C "$dir/bin" --strip-components=1
          chmod +x "$dir/bin/cargo-about"
          echo "$dir/bin" >> "$GITHUB_PATH"
      - run: pnpm build:js
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{worker-*,wasm32-wasip1}'
          merge-multiple: true
          path: .
      - run: node scripts/pack-npm.mjs
      - run: node scripts/test-npm-packages.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: npm/*.tgz
          if-no-files-found: error

  # Only this job can publish: npm only trusts the `npm` environment, which can require approval
  # (in the repository's settings). It doesn't install any dependencies.
  publish:
    name: Publish to npm
    needs: pack
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-26.04
    environment: npm
    permissions:
      contents: read
      # For trusted publishing, and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global pnpm@12.11.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: npm
      - run: node scripts/publish-npm.mjs --provenance

  release:
    name: Create the GitHub release
    needs: [check, publish]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --generate-notes "${flags[@]}"
