[package]
name = "blunt-image-optimization"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.14.2", default-features = false, features = ["napi4", "dyn-symbols"] }
napi-derive = { version = "3.6.12", default-features = false, features = ["type-def", "strict"] }

# Decoders (memory-safe Rust). We call most decoders directly to configure safety options that
# `image` doesn't expose (see AGENTS.md). Note that `image` enables the default features of its codec
# dependencies regardless of what we specify here.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff"] }
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std", "x86", "neon"] }
image-webp = { version = "0.2.4", default-features = false }
tiff = { version = "0.11.3", default-features = false }
# ICC profile -> sRGB conversion. Same major version as `image` uses.
moxcms = { version = "0.8.1", default-features = false, features = ["lut", "neon_shaper_paths", "sse_shaper_paths", "avx_shaper_paths"] }

# Image operations
fast_image_resize = { version = "6.1.0", default-features = false, features = ["std"] }

# Encoders. Sandboxing encoders isn't a goal: they only ever see pixel buffers we produced.
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }
# Also used for decoding.
png = { version = "0.18.1", default-features = false }
# Also used for decoding. `color_quant` is needed for encoding.
gif = { version = "0.14.2", default-features = false, features = ["std", "color_quant"] }
# `image-webp` only supports lossless encoding, so lossy WebP comes from libwebp (C). Never use this
# crate for decoding.
libwebp-sys = { version = "0.14.4", default-features = false }

# Based on `turbo-tasks-malloc` in Next.js. mimalloc is C, so it's not used on wasm.
[target.'cfg(all(not(target_os = "linux"), not(target_family = "wasm")))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[target.'cfg(all(target_os = "linux", not(target_family = "wasm")))'.dependencies]
# `local_dynamic_tls` is required because the addon is `dlopen`ed.
mimalloc = { version = "0.1.52", default-features = false, features = ["local_dynamic_tls"] }

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
