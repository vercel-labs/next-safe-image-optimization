[workspace]
# avif-decode is only a member because turbo can't hash local packages outside the workspace. It
# isn't a default member: it has its own binary and tests.
members = ["crates/*", "vendor/avif-decode"]
default-members = ["crates/*"]
resolver = "3"

[workspace.metadata]
name = "blunt-cargo"

[workspace.package]
# Must match package.json's: `js/native.ts` passes that, and the worker checks it.
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Everything built is the worker process or the wasm module, where a panic just ends the process (or
# instance), so neither profile unwinds. Tests ignore `panic`.
[profile.dev]
panic = "abort"

# These debug-assert on malformed input, instead of returning the error that release builds do.
# rav1d and yuv are also very slow without optimizations.
[profile.dev.package.avif-parse]
debug-assertions = false

[profile.dev.package.rav1d]
opt-level = 2
debug-assertions = false

[profile.dev.package.yuv]
opt-level = 2
debug-assertions = false

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
