[workspace]
members = ["crates/*"]
# A path dependency of `blunt-core`, not a workspace member (it has its own binary and tests).
exclude = ["vendor/avif-decode"]
resolver = "3"

[workspace.package]
# The shim checks that the worker it spawns has the same version.
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# These debug-assert on malformed input, instead of returning the error that release builds do.
# rav1d and yuv are also very slow without optimizations. Same as avif-decode's own profile.
[profile.dev.package.avif-parse]
debug-assertions = false

[profile.dev.package.rav1d]
opt-level = 2
debug-assertions = false

[profile.dev.package.yuv]
opt-level = 2
debug-assertions = false

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# For the worker process and the wasm module. A panic just ends the process (or instance), so
# there's no need for unwinding. The shim runs inside Node, so it keeps the default profiles.
[profile.worker]
inherits = "release"
panic = "abort"

[profile.worker-dev]
inherits = "dev"
panic = "abort"
