[package]
name = "avif-decode"
version = "3.0.0"
authors = ["Kornel <kornel@geekhood.net>"]
categories = ["multimedia::images"]
description = "Convert AVIF images to PNG or decompressed pixel data"
homepage = "https://lib.rs/avif-decode"
keywords = ["av1", "rav1d", "decoder", "heif"]
license = "BSD-3-Clause"
repository = "https://github.com/kornelski/avif-decode"
edition = "2024"

[[bin]]
name = "avif-decode"
path = "src/main.rs"
required-features = ["binary"]

[dependencies]
avif-parse = "2.1.0"
bytemuck = "1.25"
imgref = "1.12.3"
lodepng = { version = "3.12.2", optional = true }
log = "0.4.34"
quick-error = "2.0.1"
rgb = { version = "0.8.53", default-features = false, features = ["bytemuck"] }
yuv = "0.8.19"

# blunt-image-optimization: asm is disabled on all targets, so that decoding is entirely Rust.
# Unreleased rav1d for its Rust API (`rav1d::Decoder`). Panics in the C API (`dav1d_*`) can't
# unwind, so they abort the process.
rav1d = { git = "https://github.com/memorysafety/rav1d", rev = "0c851fa046d6a36430570459283e5886fbdd8a66", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }

[features]
default = ["binary"]
binary = ["dep:lodepng"]

# blunt-image-optimization: this is a workspace member (for turbo), so clippy lints it too.
[lints.clippy]
all = "allow"

# blunt-image-optimization: profiles removed. This is a workspace member, so Cargo would ignore them
# (with a warning). The root Cargo.toml has the ones that matter.

[badges]
maintenance = { status = "passively-maintained" }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--generate-link-to-definition"]
